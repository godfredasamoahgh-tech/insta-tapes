name: harvest

# TEMPORARY BY DESIGN: dispatch-only (NO schedule) — nothing runs unless triggered.
on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: "Instagram profile URL"
        required: false
        default: "https://www.instagram.com/androo.agi?stkn=enZ2dnVqNW8yOHNt"

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi requests

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p out
          python3 pipeline.py "${{ inputs.profile_url }}"

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: insta-tapes-output
          path: |
            out/*.txt
            out/*.json
            out/*.log
          if-no-files-found: warn
          retention-days: 14
